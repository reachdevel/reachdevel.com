name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish site to reachdevel.com
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Install Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # `site/` is the publish directory, so AGENTS.md and brand/ stay out of the web root.
      - name: Deploy
        run: npx wrangler pages deploy site --project-name=reachdevel --branch=main

      - name: Verify reachdevel.com is serving
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://reachdevel.com/)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::reachdevel.com did not return 200"
          exit 1